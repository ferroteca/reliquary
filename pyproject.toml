[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "relict"
version = "0.1.0.dev0"
description = "Generic QEMU guest runner with a complete DOS platform"
readme = "README.md"
authors = [{ name = "Paul Galbraith", email = "paul@galbraiths.ca" }]
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["qemu", "dos", "testing", "automation", "qmp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
]
dependencies = ["qemu.qmp"]

[dependency-groups]
dev = ["build"]

[project.scripts]
relict = "relict:main"

[tool.setuptools]
packages = ["relict", "relict_tests"]
