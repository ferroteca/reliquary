[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reliquary"
version = "0.1.0a2"
description = "OS installation scripting over agentless QEMU guest automation"
readme = "README.md"
authors = [{ name = "Paul Galbraith", email = "paul@galbraiths.ca" }]
requires-python = ">=3.12"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = ["qemu", "dos", "automation", "installation", "os"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
    "Topic :: System :: Installation/Setup",
]
dependencies = [
    "json5>=0.15.0",
    "keyring",
    "lark",
    "pillow",
    "qemu.qmp",
    "remanence==0.0.1a3",
    "rich",
]

[project.urls]
Homepage = "https://github.com/ferroteca/reliquary"

[dependency-groups]
dev = ["jsonschema", "pytest>=8.4"]

[project.scripts]
rlq = "reliquary:main"
reliquary = "reliquary:main"

[tool.pytest.ini_options]
# The suite ships in the sdist (D105), so a stranger's run must
# collect what this project's run collects: no plugin is loaded that
# this file did not ask for, an unreadable option is an error rather
# than a silent no-op, and a bare `pytest` finds the suite by itself.
minversion = "8.4"
testpaths = ["tests"]
addopts = "--disable-plugin-autoload --strict-config --strict-markers"
# The one marker, and it is a tier rather than a label: `tests/conftest.py`
# deselects it unless `--integration` asks for it, so the default run has
# nothing to skip.
markers = [
    "integration: a run against a live hypervisor, deselected unless --integration",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["reliquary*"]

[tool.setuptools.package-data]
reliquary = [
    "*.lark",
    "schemas/*.json",
    "schemas/*.toml",
    "fonts/*.bin",
    "codex/codex.json",
    "codex/blueprints/*.rlqb",
    "codex/scripts/*.rlqs",
]
