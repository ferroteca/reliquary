[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reliquary"
version = "0.1.0.dev3"
description = "OS installation scripting over agentless QEMU guest automation"
readme = "README.md"
authors = [{ name = "Paul Galbraith", email = "paul@galbraiths.ca" }]
requires-python = ">=3.9"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = ["qemu", "dos", "automation", "installation", "os"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: Emulators",
    "Topic :: System :: Installation/Setup",
]
dependencies = ["keyring", "lark", "pillow", "qemu.qmp"]

[project.urls]
Homepage = "https://github.com/ferroteca/reliquary"

[dependency-groups]
dev = ["build", "twine", "jsonschema"]

[project.scripts]
rlq = "reliquary:main"
reliquary = "reliquary:main"

[tool.setuptools.packages.find]
include = ["reliquary*", "reliquary_tests"]

[tool.setuptools.package-data]
reliquary = [
    "*.lark",
    "schemas/*.json",
    "codex/codex.json",
    "codex/blueprints/*.rlqb",
    "codex/scripts/*.rlqs",
]
reliquary_tests = ["fixtures/*", "fixtures/**/*"]
