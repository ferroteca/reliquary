version = 1
SPDX-PackageName = "reliquary"
SPDX-PackageSupplier = "Paul Galbraith <paul@galbraiths.ca>"

# Files that cannot (or should not) carry comment headers.
[[annotations]]
path = [
    ".gitignore",
    "README.md",
    "AGENTS.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "TRADEMARKS.md",
    "reliquary/schemas/*.json",
    "planning/design/*.schema.json",
    "planning/examples/**/*.json",
    "planning/examples/**/*.rlqb",
    "planning/examples/**/*.rlqm",
    "reliquary_tests/fixtures/**",
    "reliquary/codex/**/*.json",
    "reliquary/codex/**/*.rlqb",
    "reliquary/codex/**/*.rlqm",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Galbraith"
SPDX-License-Identifier = "BSD-3-Clause"
