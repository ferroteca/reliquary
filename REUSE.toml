version = 1
SPDX-PackageName = "reliquary"
SPDX-PackageSupplier = "Paul Galbraith <paul@galbraiths.ca>"

# Files that cannot (or should not) carry comment headers.
[[annotations]]
path = [
    ".gitignore",
    "uv.lock",
    "README.md",
    "AGENTS.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "TRADEMARKS.md",
    "reliquary/schemas/*.json",
    "tests/fixtures/**",
    "reliquary/codex/**/*.json",
    "reliquary/codex/**/*.rlqb",
    "reliquary/fonts/*.bin",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Paul Galbraith"
SPDX-License-Identifier = "GPL-3.0-only"
